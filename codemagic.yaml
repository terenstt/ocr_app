workflows:
  ios-build-app:
    name: iOS build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      # ios_signing:
      #   distribution_type: development
      #   bundle_identifier: com.terens.ocr

      groups:
        - shared_vars
      
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: master
          include: true
          source: true

    scripts:
      - name: Tools version
        script: |
          flutter --version
          xcodebuild -version
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Get CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      
      # - name: Configure iOS signing
      #   script: |
      #     xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          cd Payload/..
          zip -r Runner-unsigned.ipa Payload

    artifacts:
      - Runner-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - terens.t17@gmail.com
        notify:
          success: true
          failure: true
    